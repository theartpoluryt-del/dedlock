name: Deploy Axiom Telegram bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-axiom-bot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dll6/supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: vljgmubfztmxsyiwrity
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      BOT_KEY_ENCRYPTION_KEY: ${{ secrets.BOT_KEY_ENCRYPTION_KEY }}
      LICENSE_PEPPER: ${{ secrets.LICENSE_PEPPER }}
      ACTIVATION_CODE_PEPPER: ${{ secrets.ACTIVATION_CODE_PEPPER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD TELEGRAM_BOT_TOKEN TELEGRAM_ADMIN_CHAT_ID TELEGRAM_WEBHOOK_SECRET BOT_KEY_ENCRYPTION_KEY LICENSE_PEPPER ACTIVATION_CODE_PEPPER; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Apply database migrations
        run: |
          npx --yes supabase@2.116.0 link --project-ref "$PROJECT_REF"
          npx --yes supabase@2.116.0 db push

      - name: Set Edge Function secrets
        shell: bash
        run: |
          npx --yes supabase@2.116.0 secrets set \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_ADMIN_CHAT_ID="$TELEGRAM_ADMIN_CHAT_ID" \
            TELEGRAM_WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET" \
            BOT_KEY_ENCRYPTION_KEY="$BOT_KEY_ENCRYPTION_KEY" \
            LICENSE_PEPPER="$LICENSE_PEPPER" \
            ACTIVATION_CODE_PEPPER="$ACTIVATION_CODE_PEPPER" \
            DISPLAY_TIME_ZONE="Asia/Yekaterinburg" \
            PAYMENT_PROVIDER="disabled" \
            --project-ref "$PROJECT_REF"

      - name: Deploy Edge Function
        run: npx --yes supabase@2.116.0 functions deploy axiom-bot --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Register Telegram webhook
        shell: bash
        run: |
          webhook_url="https://${PROJECT_REF}.supabase.co/functions/v1/axiom-bot/telegram"
          payload="$(jq -nc \
            --arg url "$webhook_url" \
            --arg secret "$TELEGRAM_WEBHOOK_SECRET" \
            '{url:$url,secret_token:$secret,allowed_updates:["message","callback_query","pre_checkout_query"],drop_pending_updates:true}')"
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" \
            --data "$payload"

      - name: Register localized Telegram commands
        shell: bash
        run: |
          ru_commands='[
            {"command":"download","description":"⬇️ скачать загрузчик"},
            {"command":"buy","description":"💲 купить подписку"},
            {"command":"activate","description":"🔐 активировать код FunPay"},
            {"command":"language","description":"🇺🇸 выбрать язык"},
            {"command":"keys","description":"🔑 мои ключи"},
            {"command":"trial","description":"🎁 бесплатный период на 3 дня"},
            {"command":"guide","description":"📖 инструкция по запуску"},
            {"command":"support","description":"🛟 связаться с поддержкой"}
          ]'
          en_commands='[
            {"command":"download","description":"⬇️ download launcher"},
            {"command":"buy","description":"💲 buy a subscription"},
            {"command":"activate","description":"🔐 activate a FunPay code"},
            {"command":"language","description":"🇷🇺 choose language"},
            {"command":"keys","description":"🔑 my license keys"},
            {"command":"trial","description":"🎁 free 3-day trial"},
            {"command":"guide","description":"📖 setup and launch guide"},
            {"command":"support","description":"🛟 contact support"}
          ]'
          for language in default ru en; do
            commands="$ru_commands"
            language_code=""
            if [ "$language" = "en" ]; then commands="$en_commands"; fi
            if [ "$language" != "default" ]; then language_code="$language"; fi
            payload="$(jq -nc \
              --argjson commands "$commands" \
              --arg language_code "$language_code" \
              '($language_code == "") as $is_default | if $is_default then {commands:$commands} else {commands:$commands,language_code:$language_code} end')"
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setMyCommands" \
              -H "Content-Type: application/json" \
              --data "$payload"
          done

      - name: Verify health endpoint
        run: curl --fail-with-body --silent --show-error "https://${PROJECT_REF}.supabase.co/functions/v1/axiom-bot/health"
